name: Host, package, and policy gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: CPython ${{ matrix.python }} full host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      TT_TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10.19"
            tag: "310"
          - python: "3.12.13"
            tag: "312"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set reproducible source epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "${GITHUB_ENV}"
      - name: Install hash-locked host dependencies and build tools
        run: |
          python -m pip install --require-hashes -r "constraints/locks/host-py${{ matrix.tag }}.txt"
          python -m pip check
          python -m venv "${RUNNER_TEMP}/build-tools"
          "${RUNNER_TEMP}/build-tools/bin/python" -m pip install \
            --require-hashes -r "constraints/locks/build-dev-py${{ matrix.tag }}.txt"
          "${RUNNER_TEMP}/build-tools/bin/python" -m pip check
      - name: Validate source and repository policy
        run: |
          python -B tools/validate_lockfiles.py
          python -B qualification/tools/audit_test_taxonomy.py --collect-host
          python -B tools/check_import_boundaries.py
          python -B qualification/tools/validate_support_docs.py
          python -B qualification/tools/validate_bh_required_capabilities.py
          python -B qualification/tools/run_hardware_matrix.py --validate
          "${RUNNER_TEMP}/build-tools/bin/ruff" check src tests examples tools qualification
          "${RUNNER_TEMP}/build-tools/bin/ruff" format --check src tests examples tools qualification
          "${RUNNER_TEMP}/build-tools/bin/mypy" \
            --python-executable "$(command -v python)"
          git diff --exit-code
      - name: Build and audit distributions
        run: |
          "${RUNNER_TEMP}/build-tools/bin/python" -m build --no-isolation --outdir dist
          python -B tools/normalize_sdist.py dist/tt_transformers-2.0.0.dev0.tar.gz
          mkdir -p "${RUNNER_TEMP}/artifact-audit"
          python -B tools/audit_package_artifacts.py \
            dist/tt_transformers-2.0.0.dev0-py3-none-any.whl \
            dist/tt_transformers-2.0.0.dev0.tar.gz \
            --source-root src \
            --output-dir "${RUNNER_TEMP}/artifact-audit"
          "${RUNNER_TEMP}/build-tools/bin/python" -m twine check --strict \
            dist/tt_transformers-2.0.0.dev0-py3-none-any.whl \
            dist/tt_transformers-2.0.0.dev0.tar.gz
      - name: Build and test from the unpacked sdist
        run: |
          mkdir -p "${RUNNER_TEMP}/sdist" "${RUNNER_TEMP}/sdist-wheel"
          tar -xzf dist/tt_transformers-2.0.0.dev0.tar.gz -C "${RUNNER_TEMP}/sdist"
          cd "${RUNNER_TEMP}/sdist/tt_transformers-2.0.0.dev0"
          "${RUNNER_TEMP}/build-tools/bin/python" -m build \
            --wheel --no-isolation --outdir "${RUNNER_TEMP}/sdist-wheel"
          cmp \
            "${GITHUB_WORKSPACE}/dist/tt_transformers-2.0.0.dev0-py3-none-any.whl" \
            "${RUNNER_TEMP}/sdist-wheel/tt_transformers-2.0.0.dev0-py3-none-any.whl"
          python -m pip install --force-reinstall --no-deps \
            "${RUNNER_TEMP}/sdist-wheel/tt_transformers-2.0.0.dev0-py3-none-any.whl"
          python -m pytest -q -m host
      - name: Install final wheel non-editably
        run: |
          cd "${GITHUB_WORKSPACE}"
          python -m pip install --force-reinstall --no-deps \
            dist/tt_transformers-2.0.0.dev0-py3-none-any.whl
          python -m pip check
      - name: Run the complete host selector
        run: python -m pytest -q -m host
      - name: Prove base-only installed imports
        run: |
          python -m venv "${RUNNER_TEMP}/base-only"
          "${RUNNER_TEMP}/base-only/bin/python" -m pip install \
            --require-hashes -r "constraints/locks/base-py${{ matrix.tag }}.txt"
          "${RUNNER_TEMP}/base-only/bin/python" -m pip install \
            --no-deps dist/tt_transformers-2.0.0.dev0-py3-none-any.whl
          cp tools/probe_installed_package.py "${RUNNER_TEMP}/probe_installed_package.py"
          cd "${RUNNER_TEMP}"
          base-only/bin/python -I probe_installed_package.py

  device-policy:
    name: Device suites remain serialized and unexecuted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10.19"
      - name: Validate scheduling policy without importing TTNN
        run: |
          python -B qualification/tools/audit_test_taxonomy.py
          python -B qualification/tools/run_hardware_matrix.py --validate
          echo "Host CI never executes device-marked tests; hardware runs one node and process at a time."
