- name: On-device sampling unit tests
  cmd: 'pytest --timeout 300 tests/modules/sampling/test_legacy_sampling.py -k "ttsampling or num_single_device_vocab_splits
    or untilize_chunk_count or seed or slot_remap or topk_route_mirror_parity"

    '
  model: tt-model-sampling
  skus:
    wh_n150:
      timeout: 10
      tier: 3
    bh_p150:
      timeout: 10
      tier: 3
  owner_id: U03PUAKE719
  team: models
- name: TT-Transformers common unit tests
  cmd: 'unset TT_METAL_WATCHER

    export HF_HOME=/mnt/MLPerf/huggingface

    pytest --tb=short --ignore=tests/modules tests

    '
