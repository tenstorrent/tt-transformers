- name: Llama 3.2-1B e2e tests
  cmd: 'export HF_MODEL=meta-llama/Llama-3.2-1B-Instruct HF_HUB_OFFLINE=1 TT_CACHE_PATH=/mnt/MLPerf/huggingface/tt_cache/tttv2/meta-llama/Llama-3.2-1B-Instruct
    MESH_DEVICE=N150

    pytest --timeout 600 tests/hardware/models/llama32_1b/test_demo.py -k "token-accuracy and performance"'
  model: llama3.2-1b
  model_family: Llama
  skus:
    wh_n150:
      timeout: 5
      tier: 3
      release_ready: false
  owner_id: U03PUAKE719
  team: models
