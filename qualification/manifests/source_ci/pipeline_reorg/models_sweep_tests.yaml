- name: Sampling module sweep (common)
  cmd: 'unset TT_METAL_WATCHER  # blocked by #50886

    pytest --timeout 600 tests/modules/sampling/test_tt_sampling.py

    # Complements the above: SeedManager slot/salt state machine, params broadcast/scatter,

    # host-level trace bookkeeping. -k drops the log-probs tests, the only ones needing >1 device.

    pytest --timeout 600 tests/modules/sampling/test_legacy_sampling.py -k "not log_probs and not logprobs"

    '
  model: sampling-common
  skus:
    wh_n150:
      timeout: 12
      tier: 1
    bh_p150:
      timeout: 10
      tier: 1
  owner_id: U03PUAKE719
  team: models
